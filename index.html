<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy - Mobile Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 1. ENGLISH LOGIN SECTION */
        #auth-ui { position: fixed; inset: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #111; color: white; }
        .login-btn { width: 100%; padding: 15px; background: gold; color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* 2. TOP PANEL: ACCOUNT DETAILS */
        .top-panel { background: #121212; padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .balance-info { text-align: left; }
        .balance-amount { color: gold; font-size: 22px; font-weight: bold; }
        .user-tag { font-size: 12px; color: #888; }

        /* 3. CENTER PANEL: BIG CHART */
        .chart-section { flex: 1; background: #000; position: relative; width: 100%; }

        /* 4. BOTTOM PANEL: BUY/SELL BUTTONS & CHAT */
        .bottom-panel { background: #121212; border-top: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .action-buttons { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .buy { background: #00c805; color: white; }
        .sell { background: #ff3b3b; color: white; }
        
        /* Chat Box (Compact) */
        .chat-area { height: 80px; background: #000; border-radius: 8px; padding: 8px; overflow-y: auto; font-size: 12px; border: 1px solid #222; margin-top: 5px; }
        .chat-msg { border-bottom: 1px solid #222; padding: 3px 0; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="auth-ui">
        <div class="login-card">
            <h2 style="color:gold; margin-bottom:15px;">Trading Academy</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="login-btn" onclick="login()">LOGIN SYSTEM</button>
        </div>
    </div>

    <!-- TOP: ACCOUNT DETAILS -->
    <div class="top-panel">
        <div class="balance-info">
            <div class="user-tag" id="user-display">Account: Trader</div>
            <div class="balance-amount">$<span id="balance">5000.00</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 10px; color: #00ff00;">● LIVE MARKET</div>
            <div style="font-size: 14px; color: #888;" onclick="location.reload()">Logout</div>
        </div>
    </div>

    <!-- CENTER: BIG CHART -->
    <div class="chart-section">
        <div id="tradingview_widget" style="width:100%; height:100%;"></div>
    </div>

    <!-- BOTTOM: ACTIONS & CHAT -->
    <div class="bottom-panel">
        <div class="chat-area" id="chat-box">
            <div class="chat-msg"><b>System:</b> वेलकम! ट्रेडिंग शुरू करने के लिए बाय या सेल दबाएँ।</div>
        </div>
        
        <div class="action-buttons">
            <button class="btn buy" onclick="trade('BUY')">BUY 📈</button>
            <button class="btn sell" onclick="trade('SELL')">SELL 📉</button>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let baseBalance = 5000.00;

        function login() {
            let user = document.getElementById('username').value;
            if(user) {
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('user-display').innerText = "Account: " + user;
                loadChart();
                speak("लॉगिन सफल। आपका बैलेंस ऊपर है और ट्रेडिंग बटन नीचे सेट कर दिए गए हैं।");
            }
        }

        function loadChart() {
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:BTCUSDT",
                "interval": "5",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_widget"
            });
        }

        function trade(type) {
            speak(type + " आर्डर एक्टिवेट हो गया है। चार्ट और बैलेंस चेक करें।");
            let msgBox = document.getElementById('chat-box');
            msgBox.innerHTML += `<div class="chat-msg"><b>Trade:</b> ${type} order executed!</div>`;
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
