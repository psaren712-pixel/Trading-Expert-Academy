<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b0e11; color: #fff; overflow: hidden; }
        
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0e11; display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .box { background: #1e2329; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2b3139; }
        .box h2 { color: #f0b90b; margin-bottom: 20px; }
        .box input { width: 100%; background: #0b0e11; border: 1px solid #2b3139; padding: 12px; border-radius: 10px; margin-bottom: 10px; color: #fff; }
        .box button { width: 100%; background: #f0b90b; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .toggle-link { color: #848e9c; font-size: 0.8rem; cursor: pointer; margin-top: 15px; display: block; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <!-- Login Form -->
    <div id="login-form" class="box">
        <h2>Login</h2>
        <input type="text" id="log-email" placeholder="Email">
        <input type="password" id="log-pass" placeholder="Password">
        <button onclick="authSuccess()">LOGIN</button>
        <span class="toggle-link" onclick="toggleAuth()">Don't have an account? Register</span>
    </div>

    <!-- Register Form -->
    <div id="reg-form" class="box" style="display:none;">
        <h2>Register</h2>
        <input type="email" placeholder="Email">
        <input type="password" id="reg-pass" placeholder="Password">
        <input type="password" id="reg-conf" placeholder="Confirm Password">
        <button onclick="register()">REGISTER</button>
        <span class="toggle-link" onclick="toggleAuth()">Already have an account? Login</span>
    </div>
</div>

<script>
    function toggleAuth() {
        const l = document.getElementById('login-form');
        const r = document.getElementById('reg-form');
        l.style.display = (l.style.display === 'none') ? 'block' : 'none';
        r.style.display = (r.style.display === 'none') ? 'block' : 'none';
    }

    function authSuccess() {
        document.getElementById('auth-overlay').style.display = 'none';
        alert("Login Successful! Welcome to TE Academy.");
    }

    function register() {
        const p1 = document.getElementById('reg-pass').value;
        const p2 = document.getElementById('reg-conf').value;
        if(p1 === p2 && p1 !== "") {
            alert("Registration Successful! Please Login.");
            toggleAuth();
        } else {
            alert("Passwords do not match!");
        }
    }
</script>
</body>
</html>
