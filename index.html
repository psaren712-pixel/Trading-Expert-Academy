<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exness Ultimate Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #000; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* EXACT EXNESS TOP BAR */
        header { background: #121212; padding: 12px; display: flex; justify-content: center; align-items: center; gap: 12px; border-bottom: 1px solid #333; z-index: 100; }
        .demo-pill { background: #1e3a2f; color: #4caf50; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid #2d5a44; letter-spacing: 0.5px; }
        .balance-val { font-size: 20px; font-weight: 700; color: #fff; }

        /* FULL CHART */
        .chart-area { flex: 1; position: relative; width: 100%; background: #000; }
        #tv-container { width: 100%; height: 100%; }

        /* FLOATING P&L BOX (CANDLE TRACKER) */
        #pnl-label { 
            position: absolute; right: 50px; top: 50%; 
            background: rgba(38, 166, 154, 0.95); color: #000; 
            padding: 8px 15px; border-radius: 4px; font-weight: 800; 
            display: none; z-index: 200; font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            align-items: center; gap: 12px;
            transition: top 0.4s ease-out, background 0.3s;
        }
        .close-x { background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 16px; }

        /* FLOATING BUTTONS OVERLAY */
        .ui-overlay { 
            position: absolute; bottom: 20px; left: 0; width: 100%; 
            padding: 0 15px; display: flex; flex-direction: column; gap: 12px; z-index: 300;
        }
        .amt-input { 
            background: rgba(23, 27, 38, 0.95); border: 1px solid #444; 
            color: white; padding: 12px; border-radius: 8px; width: 110px; 
            text-align: center; align-self: center; font-weight: 800; font-size: 16px;
        }
        .action-row { display: flex; gap: 12px; width: 100%; }
        .btn-trade { flex: 1; padding: 18px; border: none; border-radius: 8px; font-weight: 800; font-size: 18px; color: white; cursor: pointer; text-transform: uppercase; }
        .buy { background: #26a69a; }
        .sell { background: #ef5350; }
    </style>
</head>
<body onclick="startVoice()">

    <header>
        <div class="demo-pill">DEMO</div>
        <div class="balance-val">$<span id="balance">200,303.21</span></div>
    </header>

    <div class="chart-area">
        <div id="pnl-label">
            <span id="live-pnl">100.00 +0.00 USD</span>
            <div class="close-x" onclick="closeTrade()">✕</div>
        </div>
        
        <div id="tv-container"></div>

        <div class="ui-overlay">
            <input type="number" id="trade-val" class="amt-input" value="1000">
            <div class="action-row">
                <button class="btn-trade buy" onclick="openTrade('BUY')">Buy</button>
                <button class="btn-trade sell" onclick="openTrade('SELL')">Sell</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let balance = 200303.21;
        let pnlTimer, activePnl = 0;
        let voiceReady = false;

        new TradingView.widget({
            "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "1",
            "theme": "dark", "style": "1", "container_id": "tv-container", "hide_top_toolbar": false
        });

        function startVoice() {
            if(!voiceReady) {
                voiceReady = true;
                speak("वॉयस असिस्टेंट तैयार है। ट्रेडिंग शुरू करें।");
            }
        }

        function openTrade(type) {
            let amt = document.getElementById('trade-val').value;
            let label = document.getElementById('pnl-label');
            label.style.display = 'flex';
            
            speak("गुरु की सलाह: " + type + " पोजीशन एक्टिव है। इस कैंडल के मूव पर ध्यान दें।");
            
            pnlTimer = setInterval(() => {
                let change = (Math.random() * 50 - 20).toFixed(2);
                activePnl = (parseFloat(activePnl) + parseFloat(change)).toFixed(2);
                
                // Candle Following Logic
                let candlePos = Math.floor(Math.random() * 35) + 30;
                label.style.top = candlePos + "%";
                
                let valBox = document.getElementById('live-pnl');
                valBox.innerText = amt + " " + (activePnl >= 0 ? "+" : "") + activePnl + " USD";
                label.style.background = activePnl >= 0 ? "rgba(38, 166, 154, 0.95)" : "rgba(239, 83, 80, 0.95)";
            }, 1000);
        }

        function closeTrade() {
            clearInterval(pnlTimer);
            balance = (parseFloat(balance) + parseFloat(activePnl)).toFixed(2);
            document.getElementById('balance').innerText = parseFloat(balance).toLocaleString();
            document.getElementById('pnl-label').style.display = 'none';
            speak("ट्रेड बंद कर दिया गया है। मुनाफा अपडेट हो गया।");
            activePnl = 0;
        }

        function speak(txt) {
            window.speechSynthesis.cancel();
            let utt = new SpeechSynthesisUtterance(txt);
            utt.lang = 'hi-IN';
            utt.pitch = 0.85; 
            utt.rate = 0.95;
            window.speechSynthesis.speak(utt);
        }
    </script>
</body>
</html>
