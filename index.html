<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Expert Academy | Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0b0e11; color: white; height: 100vh; display: flex; flex-direction: column; }
        .top-bar { padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #2b3139; }
        .balance { font-weight: bold; color: #f0b90b; }
        .chart-container { flex: 1; position: relative; margin: 10px; border-radius: 10px; overflow: hidden; }
        #pnl-tag { display: none; position: absolute; top: 15px; left: 15px; background: rgba(30,35,41,0.9); padding: 8px 12px; border-radius: 6px; border: 1px solid #2b3139; z-index: 10; }
        .action-bar { padding: 15px; background: #1e2329; border-top: 1px solid #2b3139; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="top-bar">
    <span>Demo Mode</span>
    <span class="balance" id="demo-balance">$5,000.00 USD</span>
</div>

<div class="chart-container">
    <div id="pnl-tag">
        <span id="live-pnl" style="font-weight:bold;">$0.00</span>
        <span onclick="closeTrade()" style="margin-left:10px; color:#848e9c; cursor:pointer;">X</span>
    </div>
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&theme=dark" width="100%" height="100%" frameborder="0"></iframe>
</div>

<div class="action-bar">
    <div style="display:flex; gap:10px;">
        <button style="background:#2ebd85; color:white;" onclick="startTrade('buy')">BUY</button>
        <button style="background:#f6465d; color:white;" onclick="startTrade('sell')">SELL</button>
    </div>
</div>

<script>
    let balance = 5000.00;
    let tInt;
    function updateBalanceDisplay() { document.getElementById('demo-balance').innerText = "$" + balance.toLocaleString(undefined, {minimumFractionDigits: 2}) + " USD"; }

    function say(t) { window.speechSynthesis.cancel(); const s = new SpeechSynthesisUtterance(t); s.lang = 'hi-IN'; window.speechSynthesis.speak(s); }

    function closeTrade() { 
        document.getElementById('pnl-tag').style.display = 'none'; 
        clearInterval(tInt); 
        say("ट्रेड क्लोज हो गया है।"); 
    }

    function startTrade(side) {
        document.getElementById('pnl-tag').style.display = 'block';
        if(tInt) clearInterval(tInt);
        say(side + " पोजीशन ओपन।");
        
        tInt = setInterval(() => {
            let change = (Math.random() * 50 - 22); // रैंडम PNL
            balance += change; // बैलेंस में जुड़ना या घटना
            
            const el = document.getElementById('live-pnl');
            el.innerText = (change >= 0 ? "+$" : "-$") + Math.abs(change).toFixed(2);
            el.style.color = (change >= 0 ? "#2ebd85" : "#f6465d");
            
            updateBalanceDisplay();
        }, 1000);
    }
</script>
</body>
</html>
