<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy | Student Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0b0e11; color: white; text-align: center; }
        .container { background: #1e2329; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; margin: 100px auto; border: 1px solid #2b3139; }
        input { width: 100%; background: #0b0e11; border: 1px solid #2b3139; padding: 12px; border-radius: 10px; margin-bottom: 15px; color: #fff; outline: none; }
        button { width: 100%; background: #f0b90b; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; color: #0b0e11; }
        .link { color: #848e9c; font-size: 0.8rem; margin-top: 15px; cursor: pointer; display: block; }
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e11; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="auth-section">
    <!-- Register -->
    <div class="container" id="reg-ui">
        <h2 style="color:#f0b90b; margin-bottom:20px;">Create Account</h2>
        <input type="email" id="r-email" placeholder="Student Email">
        <input type="password" id="r-pass" placeholder="Create Password">
        <button onclick="registerStudent()">JOIN ACADEMY</button>
        <span class="link" onclick="toggleUI('log')">Already a student? Login</span>
    </div>

    <!-- Login -->
    <div class="container" id="log-ui" style="display:none;">
        <h2 style="color:#f0b90b; margin-bottom:20px;">Student Login</h2>
        <input type="email" id="l-email" placeholder="Registered Email">
        <input type="password" id="l-pass" placeholder="Enter Password">
        <button onclick="loginStudent()">START LEARNING</button>
        <p id="err" style="color:#f6465d; font-size:0.8rem; margin-top:10px; display:none;">Invalid Email or Password!</p>
        <span class="link" onclick="toggleUI('reg')">New Student? Register</span>
    </div>
</div>

<div id="loader">
    <div style="width:50px; height:50px; border:5px solid #2b3139; border-top:5px solid #f0b90b; border-radius:50%; animation:spin 1s linear infinite;"></div>
    <p style="color:#f0b90b; margin-top:15px;">Loading Your Dashboard...</p>
</div>

<div id="dashboard" style="display:none; padding:20px;">
    <h2 style="color:#f0b90b;">Welcome to the Academy!</h2>
    <p id="user-welcome" style="margin-top:10px;"></p>
    <!-- यहाँ आप अपना कोर्स और चार्ट डाल सकते हैं -->
</div>

<script>
    function toggleUI(type) {
        document.getElementById('reg-ui').style.display = type === 'reg' ? 'block' : 'none';
        document.getElementById('log-ui').style.display = type === 'log' ? 'block' : 'none';
    }

    function registerStudent() {
        const email = document.getElementById('r-email').value;
        const pass = document.getElementById('r-pass').value;
        if(email && pass) {
            // डेटा को ब्राउज़र में सेव करना
            localStorage.setItem(email, pass); 
            alert("Account Created! Now Login.");
            toggleUI('log');
        } else { alert("Please fill all fields!"); }
    }

    function loginStudent() {
        const email = document.getElementById('l-email').value;
        const pass = document.getElementById('l-pass').value;
        const savedPass = localStorage.getItem(email);

        if(savedPass && savedPass === pass) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('user-welcome').innerText = "Hello, Student (" + email + ")";
            }, 3000);
        } else {
            document.getElementById('err').style.display = 'block';
        }
    }
</script>

<style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>
</body>
</html>
