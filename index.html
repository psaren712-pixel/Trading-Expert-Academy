<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Expert Academy - Exness Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* LOGIN PAGE */
        #auth-ui { position: fixed; inset: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 90%; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; }

        /* TOP PANEL: EXNESS STYLE BALANCE & P&L */
        .top-panel { background: #121212; padding: 12px 18px; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .balance-info { text-align: left; }
        .balance-amount { color: #FFCC00; font-size: 22px; font-weight: bold; }
        .pnl-display { font-size: 16px; font-weight: bold; padding: 6px 12px; border-radius: 6px; background: #1a1a1a; min-width: 100px; text-align: center; }

        /* CHART AREA */
        .chart-section { flex: 1; background: #000; }

        /* BOTTOM PANEL: ACTION BUTTONS */
        .bottom-panel { background: #121212; padding: 15px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .action-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 16px; border-radius: 10px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; color: white; transition: 0.2s; }
        .buy { background: #00c805; }
        .sell { background: #ff3b3b; }
        .close-btn { background: #444; width: 100%; font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #555; }

        .profit-text { color: #00ff00; }
        .loss-text { color: #ff3333; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="auth-ui">
        <div class="login-card">
            <h2 style="color:#FFCC00;">Exness Pro Dashboard</h2>
            <p style="color:gray; font-size:12px; margin-bottom:10px;">Secure Access for Trader</p>
            <input type="text" id="username" placeholder="Username">
            <button onclick="login()" style="width:100%; padding:14px; background:#FFCC00; border:none; border-radius:8px; font-weight:bold;">SIGN IN</button>
        </div>
    </div>

    <!-- 2. TOP BALANCE & LIVE P&L -->
    <div class="top-panel">
        <div class="balance-info">
            <div style="font-size: 10px; color: gray;">EQUITY (DEMO)</div>
            <div class="balance-amount">$<span id="balance">5000.00</span></div>
        </div>
        <div id="live-pnl" class="pnl-display">P&L: $0.00</div>
    </div>

    <!-- 3. TRADINGVIEW CHART -->
    <div class="chart-section">
        <div id="tradingview_widget" style="width:100%; height:100%;"></div>
    </div>

    <!-- 4. BOTTOM CONTROLS -->
    <div class="bottom-panel">
        <div class="action-row">
            <button id="buy-btn" class="btn buy" onclick="startTrade('BUY')">BUY</button>
            <button id="sell-btn" class="btn sell" onclick="startTrade('SELL')">SELL</button>
        </div>
        <button id="close-btn" class="btn close-btn" onclick="closeTrade()" style="display:none;">CLOSE POSITION</button>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let balance = 5000.00;
        let tradeInterval = null;
        let pnl = 0;

        function login() {
            let user = document.getElementById('username').value;
            if(user) {
                document.getElementById('auth-ui').style.display = 'none';
                new TradingView.widget({
                    "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "1",
                    "theme": "dark", "style": "1", "locale": "en", "container_id": "tradingview_widget"
                });
                speak("लॉगिन सफल। एक्स-नेस स्टाइल डैशबोर्ड सक्रिय है।");
            }
        }

        function startTrade(type) {
            document.getElementById('buy-btn').disabled = true;
            document.getElementById('sell-btn').disabled = true;
            document.getElementById('close-btn').style.display = 'block';
            
            pnl = 0;
            speak(type + " ट्रेड लग गया है। लाइव प्रॉफिट चेक करें।");
            
            tradeInterval = setInterval(() => {
                // Exness जैसा रैंडम मार्केट मूव
                let move = (Math.random() * 6 - 3).toFixed(2);
                pnl = (parseFloat(pnl) + parseFloat(move)).toFixed(2);
                
                let pnlEl = document.getElementById('live-pnl');
                pnlEl.innerHTML = `P&L: <span class="${pnl >= 0 ? 'profit-text' : 'loss-text'}">$${pnl}</span>`;
            }, 1000);
        }

        function closeTrade() {
            clearInterval(tradeInterval);
            balance = (parseFloat(balance) + parseFloat(pnl)).toFixed(2);
            document.getElementById('balance').innerText = balance;
            
            document.getElementById('buy-btn').disabled = false;
            document.getElementById('sell-btn').disabled = false;
            document.getElementById('close-btn').style.display = 'none';
            document.getElementById('live-pnl').innerHTML = `P&L: $0.00`;
            
            speak("पोजीशन क्लोज कर दी गई है। बैलेंस अपडेट हो गया है।");
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
