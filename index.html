<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: white; margin: 0; text-align: center; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        .card { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        input { width: 85%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
        .wallet { font-size: 24px; color: #ffcc00; font-weight: bold; margin: 15px 0; }
        .pnl { font-size: 18px; margin: 10px 0; font-weight: bold; }
        .btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .buy { background: #00c805; color: white; }
        .sell { background: #ff3b3b; color: white; }
        .login-btn { background: gold; color: black; }
        #app-ui { display: none; }
        .profit { color: #00ff00; }
        .loss { color: #ff3333; }
    </style>
</head>
<body>

    <!-- 1. LOGIN / REGISTER SYSTEM -->
    <div id="auth-ui" class="container">
        <div class="card">
            <h2 style="color: gold;">Expert Academy</h2>
            <p>लॉगिन या रजिस्टर करें</p>
            <input type="text" id="user" placeholder="अपना नाम लिखें">
            <input type="password" id="pass" placeholder="पासवर्ड">
            <button class="btn login-btn" onclick="login()">ENTER SYSTEM</button>
        </div>
    </div>

    <!-- 2. REAL TRADING DASHBOARD -->
    <div id="app-ui" class="container">
        <div class="card">
            <h3 id="welcome-msg">नमस्ते!</h3>
            <div class="wallet">Balance: $<span id="balance">5000.00</span></div>
            <div id="status" class="pnl">कोई एक्टिव ट्रेड नहीं है</div>
            <hr border="0.5px solid #333">
            <p>Investment Amount ($):</p>
            <input type="number" id="trade-amount" value="100" min="10">
            
            <button class="btn buy" onclick="startTrade('BUY')">BUY (लगाएँ)</button>
            <button class="btn sell" onclick="startTrade('SELL')">SELL (लगाएँ)</button>
        </div>

        <div id="guide-msg" style="color: gray; font-size: 14px;"></div>
    </div>

    <script>
        let balance = 5000.00;
        let currentTrade = null;
        let tradeInterval = null;

        function login() {
            let name = document.getElementById('user').value;
            if(name !== "") {
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('app-ui').style.display = 'block';
                document.getElementById('welcome-msg').innerText = "नमस्ते, " + name + "!";
                speak("लॉगिन सफल। आपके अकाउंट में 5000 डॉलर जमा कर दिए गए हैं।");
            }
        }

        function startTrade(type) {
            let amount = parseFloat(document.getElementById('trade-amount').value);
            if(amount > balance) {
                alert("बैलेंस कम है!");
                return;
            }

            if(tradeInterval) clearInterval(tradeInterval);
            
            speak(type + " ट्रेड शुरू हो गया है। मार्केट पर नज़र रखें।");
            let initialPrice = 100;
            let currentProfit = 0;

            tradeInterval = setInterval(() => {
                let change = (Math.random() * 2 - 1).toFixed(2); // असली मार्केट की तरह ऊपर नीचे
                currentProfit = parseFloat(currentProfit) + parseFloat(change);
                
                let statusEl = document.getElementById('status');
                statusEl.innerHTML = `Profit/Loss: <span class="${currentProfit >= 0 ? 'profit' : 'loss'}">$${currentProfit.toFixed(2)}</span>`;
                
                // बैलेंस को भी अपडेट करना (दिखाने के लिए)
                document.getElementById('balance').innerText = (balance + currentProfit).toFixed(2);
            }, 1000);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
