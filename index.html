<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy | Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; overflow-x: hidden; }

        /* लॉगिन ओवरले (सबसे पहले दिखेगा) */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0e11; display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .login-box {
            background: #1e2329; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px;
            text-align: center; border: 1px solid #2b3139; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .login-box h2 { color: #f0b90b; margin-bottom: 10px; font-size: 1.8rem; }
        .login-box p { color: #848e9c; margin-bottom: 25px; font-size: 0.9rem; }
        .login-box input {
            width: 100%; background: #0b0e11; border: 1px solid #2b3139; padding: 15px;
            border-radius: 12px; color: #fff; margin-bottom: 15px; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .login-box input:focus { border-color: #f0b90b; }
        .login-box button {
            width: 100%; background: #f0b90b; border: none; padding: 15px; border-radius: 12px;
            font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; color: #0b0e11;
        }
        .login-box button:hover { background: #d9a608; }

        /* मेन कंटेंट (लॉगिन से पहले ब्लर) */
        #main-content { filter: blur(15px); transition: 0.8s; opacity: 0.3; }

        header { background: #161a1e; padding: 15px; border-bottom: 2px solid #f0b90b; text-align: center; position: sticky; top: 0; z-index: 100; }
        .logo { color: #f0b90b; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .chart-container { width: 95%; margin: 20px auto; height: 350px; border: 1px solid #2b3139; border-radius: 15px; overflow: hidden; background: #161a1e; }

        .app-container { width: 95%; max-width: 480px; margin: 0 auto 40px; background: #1e2329; padding: 25px; border-radius: 20px; border: 1px solid #2b3139; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        
        .label { display: block; font-size: 0.8rem; color: #848e9c; margin-bottom: 8px; text-align: left; }
        .amt-input { width: 100%; background: #0b0e11; color: #f0b90b; border: 2px solid #2b3139; padding: 15px; border-radius: 12px; font-size: 1.3rem; font-weight: bold; text-align: center; margin-bottom: 20px; outline: none; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #0b0e11; padding: 15px; border-radius: 12px; border: 1px solid #2b3139; }
        .stat-title { font-size: 0.7rem; color: #848e9c; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .val-sl { color: #f6465d; font-size: 1.2rem; font-weight: bold; }
        .val-tp { color: #2ebd85; font-size: 1.2rem; font-weight: bold; }

        .btn-group { display: flex; gap: 15px; }
        .trade-btn { flex: 1; padding: 18px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .buy { background: #2ebd85; box-shadow: 0 4px 0 #1e8a60; }
        .sell { background: #f6465d; box-shadow: 0 4px 0 #c2364a; }
        .trade-btn:active { transform: translateY(3px); box-shadow: none; }

        #feedback { margin-top: 25px; min-height: 100px; padding: 15px; border-radius: 15px; font-size: 1.1rem; transition: 0.4s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<!-- लॉगिन स्क्रीन -->
<div id="login-overlay">
    <div class="login-box">
        <h2>TE Academy</h2>
        <p>प्रमोशन कोड का उपयोग करें</p>
        <input type="text" id="user" placeholder="अपना नाम">
        <input type="password" id="pass" placeholder="पासवर्ड (1234)">
        <button onclick="doLogin()">वेबसाइट खोलें</button>
        <p id="err" style="color: #f6465d; margin-top: 10px; display: none; font-size: 0.8rem;">गलत पासवर्ड! (सही: 1234)</p>
    </div>
</div>

<!-- मेन वेबसाइट -->
<div id="main-content">
    <header>
        <div class="logo">Trading Expert Academy</div>
    </header>

    <div class="chart-container">
        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=D&theme=dark" width="100%" height="100%" frameborder="0"></iframe>
    </div>

    <div class="app-container">
        <h3 style="margin-bottom: 15px; font-size: 1.1rem;">मार्केट रेजिस्टेंस पर है। आप क्या करेंगे?</h3>
        
        <label class="label">निवेश राशि (Amount)</label>
        <input type="number" id="invest" class="amt-input" value="1000" oninput="updateUI()">

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-title">Stop Loss (5%)</span>
                <span class="val-sl" id="slDisp">-$50.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Take Profit (15%)</span>
                <span class="val-tp" id="tpDisp">+$150.00</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="trade-btn buy" onclick="processTrade('buy')">BUY</button>
            <button class="trade-btn sell" onclick="processTrade('sell')">SELL</button>
        </div>

        <div id="feedback"></div>
    </div>
</div>

<script>
    function speak(txt) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'hi-IN';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function doLogin() {
        const p = document.getElementById('pass').value;
        const u = document.getElementById('user').value;
        if(p === "1234") {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.filter = 'none';
            document.getElementById('main-content').style.opacity = '1';
            speak("नमस्ते " + u + ", ट्रेडिंग एक्सपर्ट एकेडमी में आपका स्वागत है।");
        } else {
            document.getElementById('err').style.display = 'block';
            speak("गलत पासवर्ड।");
        }
    }

    function updateUI() {
        const v = document.getElementById('invest').value || 0;
        document.getElementById('slDisp').innerText = "-$" + (v * 0.05).toFixed(2);
        document.getElementById('tpDisp').innerText = "+$" + (v * 0.15).toFixed(2);
    }

    function processTrade(type) {
        const amt = document.getElementById('invest').value;
        const fb = document.getElementById('feedback');
        const sl = (amt * 0.05).toFixed(2);
        const tp = (amt * 0.15).toFixed(2);
        
        let text = "";
        if(type === 'sell') {
            fb.style.background = "rgba(46, 189, 133, 0.1)";
            fb.innerHTML = "<b style='color:#2ebd85; font-size: 1.4rem;'>⭐ शानदार फैसला ⭐</b><br>मुनाफा लक्ष्य: $" + tp;
            text = "शानदार! रेजिस्टेंस पर सेल करना बिल्कुल सही है। इसमें आपका प्रॉफिट " + tp + " डॉलर हो सकता है।";
        } else {
            fb.style.background = "rgba(246, 70, 93, 0.1)";
            fb.innerHTML = "<b style='color:#f6465d; font-size: 1.4rem;'>गलत ट्रेड!</b><br>जोखिम: $" + sl;
            text = "गलत फैसला! रेजिस्टेंस पर खरीदने से आपका " + sl + " डॉलर का नुकसान तुरंत हो सकता है।";
        }
        speak(text);
        setTimeout(() => { fb.innerHTML = ""; fb.style.background = "transparent"; }, 10000);
    }
</script>
</body>
</html>
