<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy | Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #161a1e; padding: 10px 20px; border-bottom: 1px solid #2b3139; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { color: #f0b90b; font-size: 1.2rem; font-weight: bold; }
        #google_translate_element { margin-top: 5px; }
        .chart-box { width: 95%; margin: 15px auto; height: 350px; border-radius: 12px; overflow: hidden; border: 1px solid #2b3139; }
        .panel { background: #1e2329; margin: 10px auto; width: 95%; max-width: 500px; padding: 25px; border-radius: 15px; text-align: center; }
        .actions { display: flex; gap: 15px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .buy { background: #2ebd85; color: white; }
        .sell { background: #f6465d; color: white; }
        #feedback { margin-top: 20px; font-size: 1.1rem; min-height: 60px; }
        .stars { font-size: 2rem; color: #f0b90b; display: block; }
    </style>
</head>
<body>

<header>
    <div class="logo">Trading Expert Academy</div>
    <div id="google_translate_element"></div>
</header>

<div class="chart-box">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=D&theme=dark" width="100%" height="100%" frameborder="0"></iframe>
</div>

<div class="panel">
    <h3>मार्केट रेजिस्टेंस पर है। आप क्या करेंगे?</h3>
    <div class="actions">
        <button class="btn buy" onclick="check('buy')">BUY</button>
        <button class="btn sell" onclick="check('sell')">SELL</button>
    </div>
    <div id="feedback"></div>
</div>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'hi'}, 'google_translate_element');
    }
    function check(type) {
        const fb = document.getElementById('feedback');
        if(type === 'sell') {
            fb.innerHTML = "<span class='stars'>⭐⭐</span> शानदार! सही फैसला।";
        } else {
            fb.innerHTML = "<b style='color:#f6465d'>गलत!</b> यहाँ से मार्केट गिर सकता है।";
        }
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
