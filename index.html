<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid #334155; max-width: 500px; margin: auto; }
        .btn-buy { background: #22c55e; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin: 10px; }
        .btn-sell { background: #ef4444; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin: 10px; }
        #feedback { margin-top: 20px; font-size: 1.3rem; min-height: 50px; }
        .reward { color: #facc15; font-size: 2.5rem; display: block; margin-bottom: 10px; }
        .error { color: #fb7185; }
    </style>
</head>
<body>
    <h1>Trading Expert Academy 📈</h1>
    <div class="card">
        <p>मार्केट रेजिस्टेंस (Resistance) के पास है... आप क्या करेंगे?</p>
        <button class="btn-buy" onclick="checkTrade('buy')">BUY</button>
        <button class="btn-sell" onclick="checkTrade('sell')">SELL</button>
        <div id="feedback"></div>
    </div>

    <script>
        function checkTrade(action) {
            const display = document.getElementById('feedback');
            if (action === 'sell') {
                display.innerHTML = "<span class='reward'>⭐⭐ +</span> शानदार! रेजिस्टेंस पर सेल करना सही फैसला था।";
            } else {
                display.innerHTML = "<span class='error'>गलती!</span> रेजिस्टेंस पर बाय करने से मार्केट नीचे गिर सकता है।";
            }
        }
    </script>
</body>
</html>
