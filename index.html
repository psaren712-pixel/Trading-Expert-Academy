<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expert Trading Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        .top-nav { background: #171b26; padding: 10px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; }
        .balance { color: #ffcc00; font-weight: bold; font-size: 18px; }

        /* CHART AREA */
        .chart-section { flex: 1; position: relative; }

        /* FOOTER CONTROLS - (बटन की पोजीशन को ऊपर रखा गया है) */
        .controls { background: #171b26; padding: 15px; border-top: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .input-box { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 5px; }
        input { background: #2a2e39; border: none; color: white; padding: 10px; border-radius: 5px; width: 120px; text-align: center; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; color: white; }
        .buy { background: #26a69a; }
        .sell { background: #ef5350; }
        
        /* FLOATING PNL */
        #floating-pnl { position: absolute; right: 20px; top: 40%; background: #26a69a; color: white; padding: 8px 12px; border-radius: 5px; display: none; z-index: 999; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="balance">Balance: $<span id="balance">200303.21</span></div>
    </div>

    <div class="chart-section">
        <div id="floating-pnl">
            <span id="pnl-text">0.00 USD</span>
            <span onclick="closeTrade()" style="margin-left:10px; cursor:pointer;">✕</span>
        </div>
        <div id="tv-widget" style="width:100%; height:100%;"></div>
    </div>

    <div class="controls">
        <div class="input-box">
            <span>Amount:</span>
            <input type="number" id="trade-amount" value="100">
        </div>
        <div class="btn-grid">
            <button class="btn buy" onclick="openTrade('BUY')">BUY</button>
            <button class="btn sell" onclick="openTrade('SELL')">SELL</button>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // JS logic same as before...
        new TradingView.widget({"autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "1", "theme": "dark", "container_id": "tv-widget"});
        
        function openTrade(type) {
            document.getElementById('floating-pnl').style.display = 'flex';
            // ... बाकी कोड पहले जैसा
        }
        function closeTrade() {
            document.getElementById('floating-pnl').style.display = 'none';
        }
    </script>
</body>
</html>
