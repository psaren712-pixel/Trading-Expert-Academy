<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy - Advanced Guide</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0f0f0f; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .buy-btn { background-color: #28a745; color: white; }
        .sell-btn { background-color: #dc3545; color: white; }
        #guide-box { display: none; background: #2a2a2a; padding: 15px; margin-top: 20px; border-radius: 10px; text-align: left; border-left: 5px solid #ffcc00; }
        h3 { color: #ffcc00; margin-top: 0; }
        ul { padding-left: 20px; }
        li { margin-bottom: 10px; color: #ddd; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Trading Expert Academy</h2>
        <p>अपना ट्रेड चुनें और गाइडेंस देखें</p>
        
        <button class="btn buy-btn" onclick="showGuide('buy')">BUY गाइड शुरू करें 📈</button>
        <button class="btn sell-btn" onclick="showGuide('sell')">SELL गाइड शुरू करें 📉</button>

        <!-- यहाँ नीचे डिक्शनरी/गाइड खुलेगी -->
        <div id="guide-box">
            <h3 id="guide-title">निर्देश:</h3>
            <ul id="guide-list">
                <!-- यहाँ लिस्ट अपने आप आएगी -->
            </ul>
        </div>
    </div>

    <script>
        function showGuide(type) {
            var box = document.getElementById('guide-box');
            var list = document.getElementById('guide-list');
            var title = document.getElementById('guide-title');
            box.style.display = 'block';
            list.innerHTML = ""; // पुराना साफ करने के लिए

            if(type === 'buy') {
                title.innerText = "BUY करने के नियम:";
                var steps = [
                    "1. मार्केट का ट्रेंड चेक करें (Bullish होना चाहिए)।",
                    "2. RSI इंडिकेटर को देखें, क्या यह 30 के पास है?",
                    "3. सपोर्ट लेवल पर ग्रीन कैंडल बनने का इंतज़ार करें।",
                    "4. एंट्री लेने से पहले स्टॉप लॉस (SL) तय करें।"
                ];
                guide("बाय करने के नियम नीचे दिए गए हैं। सबसे पहले मार्केट ट्रेंड और सपोर्ट लेवल चेक करें।");
            } else {
                title.innerText = "SELL करने के नियम:";
                var steps = [
                    "1. मार्केट का ट्रेंड चेक करें (Bearish होना चाहिए)।",
                    "2. रेजिस्टेंस लेवल पर रेड कैंडल देखें।",
                    "3. वॉल्यूम चेक करें कि सेलर्स बढ़ रहे हैं या नहीं।",
                    "4. अपनी रिस्क के हिसाब से टारगेट सेट करें।"
                ];
                guide("सेल करने के नियम नीचे लोड हो गए हैं। रेजिस्टेंस और वॉल्यूम पर ध्यान दें।");
            }

            // लिस्ट को स्क्रीन पर डालना
            steps.forEach(function(step) {
                var li = document.createElement("li");
                li.innerText = step;
                list.appendChild(li);
            });
        }

        function guide(message) {
            window.speechSynthesis.cancel(); 
            var speech = new SpeechSynthesisUtterance();
            speech.text = message;
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
