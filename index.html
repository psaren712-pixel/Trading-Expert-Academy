<!-- यह कोड अपनी index.html में अपडेट करें -->
<div class="panel">
    <h3>मार्केट रेजिस्टेंस पर है</h3>
    
    <!-- पैसे सेट करने का विकल्प -->
    <div style="margin: 15px 0;">
        <label style="font-size: 0.9rem; color: #848e9c;">कितने पैसे लगाएंगे? (INR/USD):</label><br>
        <input type="number" id="investment" value="1000" style="background: #0b0e11; color: #f0b90b; border: 1px solid #2b3139; padding: 10px; border-radius: 5px; width: 80%; margin-top: 5px; font-weight: bold; text-align: center;">
    </div>

    <div class="risk-stats">
        <div class="stat-item">
            <span class="label">STOP LOSS (नुकसान)</span>
            <span class="sl" id="sl-val">-$50.00</span>
        </div>
        <div class="stat-item">
            <span class="label">TAKE PROFIT (मुनाफा)</span>
            <span class="tp" id="tp-val">+$150.00</span>
        </div>
    </div>

    <div class="actions">
        <button class="btn buy" onclick="analyze('buy')">BUY</button>
        <button class="btn sell" onclick="analyze('sell')">SELL</button>
    </div>
    <div id="feedback"></div>
</div>

<script>
    function analyze(type) {
        const amt = document.getElementById('investment').value;
        const slDisplay = document.getElementById('sl-val');
        const tpDisplay = document.getElementById('tp-val');
        const fb = document.getElementById('feedback');
        
        // कैलकुलेशन: 5% रिस्क और 15% प्रॉफिट (1:3 रेशियो)
        const slAmt = (amt * 0.05).toFixed(2);
        const tpAmt = (amt * 0.15).toFixed(2);
        
        slDisplay.innerText = "-" + slAmt;
        tpDisplay.innerText = "+" + tpAmt;

        let message = "";
        if(type === 'sell') {
            fb.style.backgroundColor = "rgba(46, 189, 133, 0.15)";
            fb.innerHTML = `<span class='stars'>⭐⭐</span> <b style='color:#2ebd85'>शानदार!</b><br>
                            आपने ${amt} रुपये लगाए। आपका संभावित मुनाफा ${tpAmt} है।`;
            message = `शानदार फैसला! आपने ${amt} रुपये के निवेश पर सही रिस्क मैनेजमेंट किया है। यहाँ आपका मुनाफा ${tpAmt} रुपये हो सकता है।`;
        } else {
            fb.style.backgroundColor = "rgba(246, 70, 93, 0.15)";
            fb.innerHTML = `<b style='color:#f6465d'>बड़ी गलती!</b><br>
                            यहाँ आपका ${slAmt} का लॉस तुरंत हो सकता है।`;
            message = `बड़ी गलती! इस ट्रेड में आप अपने ${amt} रुपये में से ${slAmt} रुपये तुरंत खो सकते हैं। रेजिस्टेंस पर कभी न खरीदें।`;
        }

        speak(message);
        setTimeout(() => { fb.innerHTML = ""; fb.style.backgroundColor = "transparent"; }, 10000);
    }
</script>
