<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy | Professional Risk-Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; display: flex; flex-direction: column; min-height: 100vh; text-align: center; }
        header { background: #161a1e; padding: 15px; border-bottom: 1px solid #2b3139; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #f0b90b; font-size: 1.2rem; font-weight: bold; }
        .chart-box { width: 95%; margin: 15px auto; height: 300px; border-radius: 12px; overflow: hidden; border: 1px solid #2b3139; }
        .panel { background: #1e2329; margin: 10px auto; width: 95%; max-width: 500px; padding: 25px; border-radius: 15px; }
        .risk-stats { display: flex; justify-content: space-around; margin: 15px 0; background: #0b0e11; padding: 10px; border-radius: 8px; border: 1px solid #2b3139; }
        .stat-item { flex: 1; }
        .label { font-size: 0.8rem; color: #848e9c; display: block; margin-bottom: 5px; }
        .sl { color: #f6465d; font-weight: bold; }
        .tp { color: #2ebd85; font-weight: bold; }
        .actions { display: flex; gap: 15px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .buy { background: #2ebd85; color: white; }
        .sell { background: #f6465d; color: white; }
        #feedback { margin-top: 20px; font-size: 1.1rem; min-height: 100px; padding: 15px; border-radius: 8px; transition: 0.3s; }
        .stars { font-size: 2.5rem; color: #f0b90b; display: block; }
    </style>
</head>
<body>

<header>
    <div class="logo">Trading Expert Academy</div>
</header>

<div class="chart-box">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&theme=dark" width="100%" height="100%" frameborder="0"></iframe>
</div>

<div class="panel">
    <h3>मार्केट रेजिस्टेंस (Resistance) पर है</h3>
    
    <div class="risk-stats">
        <div class="stat-item">
            <span class="label">STOP LOSS (नुकसान)</span>
            <span class="sl">-$50.00</span>
        </div>
        <div class="stat-item">
            <span class="label">TAKE PROFIT (मुनाफा)</span>
            <span class="tp">+$150.00</span>
        </div>
    </div>

    <p style="font-size: 0.9rem; color: #848e9c;">रिस्क-रिवॉर्ड रेशियो - 1:3</p>

    <div class="actions">
        <button class="btn buy" onclick="analyze('buy')">BUY</button>
        <button class="btn sell" onclick="analyze('sell')">SELL</button>
    </div>
    <div id="feedback"></div>
</div>

<script>
    function speak(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'hi-IN';
        window.speechSynthesis.speak(msg);
    }

    function analyze(type) {
        const fb = document.getElementById('feedback');
        let message = "";
        
        if(type === 'sell') {
            fb.style.backgroundColor = "rgba(46, 189, 133, 0.15)";
            fb.innerHTML = "<span class='stars'>⭐⭐</span> <b style='color:#2ebd85'>बेहतरीन ट्रेड!</b><br>यहाँ आपका रिस्क सिर्फ 50 डॉलर है और प्रॉफिट 150 डॉलर।";
            message = "शानदार! आपने रेजिस्टेंस पर सही ट्रेड लिया। यहाँ आपका स्टॉप लॉस बहुत छोटा है और टेक प्रॉफिट काफी बड़ा है। इसे कहते हैं स्मार्ट ट्रेडिंग।";
        } else {
            fb.style.backgroundColor = "rgba(246, 70, 93, 0.15)";
            fb.innerHTML = "<b style='color:#f6465d'>बड़ी गलती!</b><br>रिस्क बहुत ज्यादा है। स्टॉप लॉस तुरंत हिट हो सकता है।";
            message = "गलत फैसला! रेजिस्टेंस पर खरीदने से आपका स्टॉप लॉस बहुत जल्दी हिट हो जाएगा और आपको भारी नुकसान हो सकता है। हमेशा बड़े प्रॉफिट के लिए रेजिस्टेंस पर सेल करें।";
        }

        speak(message);

        // 10 सेकंड का समय ताकि यूजर आराम से सुन और पढ़ सके
        setTimeout(() => {
            fb.innerHTML = "";
            fb.style.backgroundColor = "transparent";
        }, 10000);
    }
</script>

</body>
</html>
