<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy | Live PNL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; overflow-x: hidden; }

        /* Auth & Loader remain same for DLX feel */
        #auth-overlay, #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e11; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .auth-box { background: #1e2329; padding: 35px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2b3139; }
        input { width: 100%; background: #0b0e11; border: 1px solid #2b3139; padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; }
        button { width: 100%; background: #f0b90b; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; color: #0b0e11; }

        /* Live PNL Panel */
        .pnl-panel { background: #1e2329; margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid #2b3139; display: none; }
        .pnl-value { font-size: 2rem; font-weight: bold; margin: 10px 0; transition: 0.3s; }
        .green { color: #2ebd85; }
        .red { color: #f6465d; }

        #main-content { display: none; text-align: center; }
        .chart-frame { width: 96%; margin: 10px auto; height: 350px; border-radius: 15px; overflow: hidden; border: 1px solid #2b3139; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box" id="reg-box">
        <h2>Register</h2>
        <input type="password" id="reg-pass" placeholder="Create Password">
        <button onclick="saveUser()">REGISTER</button>
    </div>
    <div class="auth-box" id="log-box" style="display:none;">
        <h2>Login</h2>
        <input type="password" id="log-pass" placeholder="Enter Password">
        <button onclick="checkUser()">ACCESS ACADEMY</button>
    </div>
</div>

<div id="loader" style="display:none;">
    <div style="width:50px; height:50px; border:5px solid #2b3139; border-top:5px solid #f0b90b; border-radius:50%; animation:spin 1s linear infinite;"></div>
    <p style="color:#f0b90b; margin-top:15px;">Live Syncing...</p>
</div>

<div id="main-content">
    <header style="padding:15px; border-bottom:1px solid #2b3139;"><h2 style="color:#f0b90b;">TE ACADEMY</h2></header>
    
    <div class="chart-frame">
        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&theme=dark" width="100%" height="100%" frameborder="0"></iframe>
    </div>

    <!-- Live PNL Area -->
    <div class="pnl-panel" id="pnl-section">
        <p style="font-size:0.8rem; color:#848e9c;">Floating Profit/Loss (PNL)</p>
        <div id="live-pnl" class="pnl-value">$0.00</div>
        <p id="pnl-pct" style="font-size:0.9rem;">0.00%</p>
    </div>

    <div style="padding:20px;">
        <input type="number" id="trade-amt" value="1000" style="width:100%; background:#0b0e11; color:#f0b90b; border:1px solid #2b3139; padding:15px; border-radius:12px; text-align:center; font-size:1.2rem;">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button style="flex:1; background:#2ebd85; color:white;" onclick="startTrade('buy')">BUY</button>
            <button style="flex:1; background:#f6465d; color:white;" onclick="startTrade('sell')">SELL</button>
        </div>
    </div>
</div>

<script>
    let pnlInterval;
    function say(t) { window.speechSynthesis.cancel(); const s = new SpeechSynthesisUtterance(t); s.lang = 'hi-IN'; window.speechSynthesis.speak(s); }

    function saveUser() { 
        localStorage.setItem('te_pass', document.getElementById('reg-pass').value); 
        document.getElementById('reg-box').style.display='none'; 
        document.getElementById('log-box').style.display='block'; 
    }

    function checkUser() {
        if(document.getElementById('log-pass').value === localStorage.getItem('te_pass')) {
            document.getElementById('auth-overlay').style.display='none';
            document.getElementById('loader').style.display='flex';
            setTimeout(() => {
                document.getElementById('loader').style.display='none';
                document.getElementById('main-content').style.display='block';
            }, 2000);
        } else { alert("Wrong Password!"); }
    }

    function startTrade(type) {
        document.getElementById('pnl-section').style.display = 'block';
        const amt = document.getElementById('trade-amt').value;
        say(type === 'buy' ? "बाय ट्रेड शुरू हो गया है।" : "सेल ट्रेड शुरू हो गया है।");
        
        if(pnlInterval) clearInterval(pnlInterval);

        // लाइव PNL का जादू यहाँ है
        pnlInterval = setInterval(() => {
            // थोड़ा सा रैंडम उतार-चढ़ाव (Realistic feel)
            let change = (Math.random() * 10 - 4.5).toFixed(2); 
            const display = document.getElementById('live-pnl');
            const pct = document.getElementById('pnl-pct');
            
            display.innerText = (change >= 0 ? "+$" : "-$") + Math.abs(change);
            display.className = "pnl-value " + (change >= 0 ? "green" : "red");
            pct.innerText = ((change/amt)*100).toFixed(2) + "%";
            pct.className = (change >= 0 ? "green" : "red");
        }, 1500);
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</script>
</body>
</html>
