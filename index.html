<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Expert Academy | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0e11; color: #fff; overflow-x: hidden; }

        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e11; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .auth-box { background: #1e2329; padding: 35px; border-radius: 24px; width: 92%; max-width: 400px; text-align: center; border: 1px solid #2b3139; }
        .auth-box h2 { color: #f0b90b; margin-bottom: 20px; }
        .auth-box input { width: 100%; background: #0b0e11; border: 1px solid #2b3139; padding: 15px; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; }
        .auth-box button { width: 100%; background: #f0b90b; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; color: #0b0e11; margin-top: 10px; }
        .toggle-txt { color: #848e9c; font-size: 0.85rem; margin-top: 15px; cursor: pointer; display: block; }
        
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e11; z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #2b3139; border-top: 5px solid #f0b90b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #main-content { display: none; padding-bottom: 40px; text-align: center; }
        .pnl-val { font-size: 2.2rem; font-weight: bold; margin: 10px 0; }
        .green { color: #2ebd85; } .red { color: #f6465d; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box" id="reg-box">
        <h2>Register</h2>
        <input type="email" id="r-email" placeholder="Email">
        <input type="password" id="r-pass" placeholder="Password">
        <input type="password" id="c-pass" placeholder="Confirm Password">
        <button onclick="handleRegister()">REGISTER NOW</button>
        <span class="toggle-txt" onclick="toLogin()">Already a member? Login</span>
    </div>

    <div class="auth-box" id="log-box" style="display:none;">
        <h2>Login</h2>
        <input type="email" id="l-email" placeholder="Email">
        <input type="password" id="l-pass" placeholder="Password">
        <button onclick="handleLogin()">ACCESS ACADEMY</button>
        <span class="toggle-txt" onclick="toForgot()">Forgot Password?</span>
        <span class="toggle-txt" onclick="toReg()">New User? Register</span>
    </div>

    <div class="auth-box" id="forgot-box" style="display:none;">
        <h2>Reset Password</h2>
        <input type="email" id="f-email" placeholder="Enter Registered Email">
        <button onclick="recoverPass()">SEND RECOVERY LINK</button>
        <span class="toggle-txt" onclick="toLogin()">Back to Login</span>
    </div>
</div>

<div id="loader"><div class="spinner"></div><p style="color:#f0b90b; margin-top:20px;">SYNCING DATA...</p></div>

<div id="main-content">
    <h2 style="color:#f0b90b; padding:20px;">TE ACADEMY LIVE</h2>
    <div style="width:95%; margin:auto; height:350px; border-radius:15px; overflow:hidden; border:1px solid #2b3139;">
        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&theme=dark" width="100%" height="100%" frameborder="0"></iframe>
    </div>
    <div id="pnl-area" style="background:#1e2329; margin:20px; padding:20px; border-radius:15px; display:none;">
        <p style="color:#848e9c; font-size:0.8rem;">Live Floating PNL</p>
        <div id="live-pnl" class="pnl-val">$0.00</div>
    </div>
    <div style="padding:20px; max-width:450px; margin:auto;">
        <input type="number" id="amt" value="1000" style="width:100%; background:#0b0e11; color:#f0b90b; border:1px solid #2b3139; padding:15px; border-radius:12px; text-align:center; font-size:1.2rem; margin-bottom:15px;">
        <div style="display:flex; gap:10px;">
            <button style="flex:1; background:#2ebd85; color:white; padding:16px; border-radius:12px; border:none; font-weight:bold;" onclick="startTrade('buy')">BUY</button>
            <button style="flex:1; background:#f6465d; color:white; padding:16px; border-radius:12px; border:none; font-weight:bold;" onclick="startTrade('sell')">SELL</button>
        </div>
    </div>
</div>

<script>
    function toLogin() { hideAll(); document.getElementById('log-box').style.display='block'; }
    function toReg() { hideAll(); document.getElementById('reg-box').style.display='block'; }
    function toForgot() { hideAll(); document.getElementById('forgot-box').style.display='block'; }
    function hideAll() { document.getElementById('reg-box').style.display='none'; document.getElementById('log-box').style.display='none'; document.getElementById('forgot-box').style.display='none'; }

    function handleRegister() {
        const e = document.getElementById('r-email').value;
        const p1 = document.getElementById('r-pass').value;
        const p2 = document.getElementById('c-pass').value;
        if(e && p1 === p2 && p1 !== "") { localStorage.setItem(e, p1); alert("Account Created!"); toLogin(); }
        else { alert("Check details!"); }
    }

    function handleLogin() {
        const e = document.getElementById('l-email').value;
        const p = document.getElementById('l-pass').value;
        if(localStorage.getItem(e) === p) {
            document.getElementById('auth-overlay').style.display='none';
            document.getElementById('loader').style.display='flex';
            setTimeout(() => { document.getElementById('loader').style.display='none'; document.getElementById('main-content').style.display='block'; }, 2000);
        } else { alert("Wrong Email or Password!"); }
    }

    function recoverPass() {
        const e = document.getElementById('f-email').value;
        if(localStorage.getItem(e)) { alert("Recovery link sent to " + e); toLogin(); }
        else { alert("Email not found!"); }
    }

    let tInt;
    function startTrade(type) {
        document.getElementById('pnl-area').style.display = 'block';
        if(tInt) clearInterval(tInt);
        tInt = setInterval(() => {
            let n = (Math.random() * 15 - 6).toFixed(2);
            const el = document.getElementById('live-pnl');
            el.innerText = (n >= 0 ? "+$" : "-$") + Math.abs(n);
            el.className = "pnl-val " + (n >= 0 ? "green" : "red");
        }, 1500);
    }
</script>
</body>
</html>
